name: One-time migration from old shellroom repo

on:
  push:
    paths:
      - '.github/workflows/migrate-from-old-repo.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out new repository
        uses: actions/checkout@v4

      - name: Fetch Claude branch from old repository
        run: |
          git clone --depth 1 --branch claude/new-session-igh8y4 https://github.com/shanimosco47-pixel/shellroom.git /tmp/old-shellroom

      - name: Copy simulation project only
        run: |
          rm -rf sim
          cp -a /tmp/old-shellroom/sim ./sim
          cp /tmp/old-shellroom/.gitignore ./.gitignore

      - name: Commit migrated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sim .gitignore
          git commit -m "Migrate shellroom simulation from PR #20"
          git push
